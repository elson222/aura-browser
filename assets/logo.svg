<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181428"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Aura Primary Continuous Ribbon Gradients -->
    <linearGradient id="auroraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <linearGradient id="auroraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4FACFE" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGlow)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Iconic Pure Geometric Ribbon 'A' & Infinity Horizon (Human-Engineered Vector Architecture) -->
  <g filter="url(#softShadow)" transform="translate(0, -6)">
    <!-- Outer Arc Ribbon (Left to Apex to Right Loop) -->
    <path d="M156 364 C132 364 120 338 136 308 L232 142 C244 122 268 122 280 142 L376 308 C392 338 380 364 356 364 C336 364 322 350 312 332 L256 230 L200 332 C190 350 176 364 156 364 Z" 
          fill="url(#auroraGrad1)"/>

    <!-- Inner Continuous Prismatic Bridge / Crossbar -->
    <path d="M188 288 C180 288 174 282 178 274 L244 158 C250 148 262 148 268 158 L334 274 C338 282 332 288 324 288 C294 288 278 270 256 270 C234 270 218 288 188 288 Z" 
          fill="url(#auroraGrad2)" opacity="0.96"/>

    <!-- Luminous Core Spark Center -->
    <circle cx="256" cy="216" r="16" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
