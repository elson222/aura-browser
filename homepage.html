<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: #71717a;
      --input-bg: rgba(20, 20, 26, 0.85);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #ffffff;
      --tile-bg: rgba(255, 255, 255, 0.03);
      --tile-border: rgba(255, 255, 255, 0.06);
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --card-bg: rgba(0, 0, 0, 0.03);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: rgba(0, 0, 0, 0.06);
      --text-main: #09090b;
      --text-sub: #64748b;
      --input-bg: #f8fafc;
      --input-border: rgba(0, 0, 0, 0.12);
      --input-focus: #000000;
      --tile-bg: #f1f5f9;
      --tile-border: rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --bg-color: #ffffff;
        --card-bg: rgba(0, 0, 0, 0.03);
        --card-border: rgba(0, 0, 0, 0.08);
        --card-hover: rgba(0, 0, 0, 0.06);
        --text-main: #09090b;
        --text-sub: #64748b;
        --input-bg: #f8fafc;
        --input-border: rgba(0, 0, 0, 0.12);
        --input-focus: #000000;
        --tile-bg: #f1f5f9;
        --tile-border: rgba(0, 0, 0, 0.06);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      padding: 24px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Brand Header with Custom Logo */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo-glow-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 16px;
    }

    .logo-glow-wrapper::after {
      content: '';
      position: absolute;
      inset: -4px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.35) 0%, rgba(6, 182, 212, 0.2) 60%, transparent 80%);
      border-radius: 28px;
      z-index: -1;
      filter: blur(12px);
      transition: filter 0.3s ease;
    }

    .logo-glow-wrapper:hover::after {
      filter: blur(18px);
    }

    .logo-img {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .logo-img:hover {
      transform: scale(1.05);
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-sub);
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    /* Google Search Centerpiece (Zen & Chrome Style) */
    .search-container {
      width: 100%;
      margin-bottom: 32px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--input-border);
      border-radius: 36px;
      padding: 6px 16px 6px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-bar:hover,
    .search-bar:focus-within {
      border-color: var(--input-focus);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 0 1px var(--input-focus);
      background: rgba(26, 26, 34, 0.95);
    }

    .google-icon {
      margin-right: 14px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      height: 46px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .search-input::placeholder {
      color: var(--text-sub);
      font-weight: 400;
    }

    .search-submit-btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .search-submit-btn:hover {
      transform: scale(1.08);
      opacity: 0.95;
    }

    .search-submit-btn:active {
      transform: scale(0.94);
    }

    /* Speed Dial Top Sites (Clean Chrome / Zen Minimalist Grid) */
    .speed-dial-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 580px;
      margin-bottom: 36px;
    }

    @media (max-width: 520px) {
      .speed-dial-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .speed-dial-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 10px;
      background: var(--tile-bg);
      border: 1px solid var(--tile-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .speed-dial-tile:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .tile-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .tile-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Floating Status Dock */
    .status-dock {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
    }

    .dock-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #34d399;
      padding: 4px 10px;
      border-radius: 14px;
      background: rgba(52, 211, 153, 0.1);
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .dock-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
    }

    kbd {
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body data-theme="dark">

  <div class="main-wrap">
    <!-- Brand Header -->
    <div class="brand-section">
      <div class="logo-glow-wrapper">
        <img class="logo-img" src="assets/logo.jpg" alt="Aura Logo" />
      </div>
      <h1 class="brand-title">Aura Browser</h1>
      <span class="brand-subtitle">Private • Borderless • Fast</span>
    </div>

    <!-- Google Search Box -->
    <div class="search-container">
      <form id="searchForm">
        <div class="search-bar">
          <div class="google-icon">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.29 21.43 7.37 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.29 2.57 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search Google or enter a web address..." 
            autocomplete="off" 
            autofocus 
          />
          <button type="submit" class="search-submit-btn" title="Search Google">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Speed Dial Top Sites (Clean Chrome/Zen Aesthetic) -->
    <div class="speed-dial-grid">
      <div class="speed-dial-tile" data-url="https://www.youtube.com">
        <div class="tile-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ef4444"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </div>
        <span class="tile-title">YouTube</span>
      </div>

      <div class="speed-dial-tile" data-url="https://github.com">
        <div class="tile-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        </div>
        <span class="tile-title">GitHub</span>
      </div>

      <div class="speed-dial-tile" data-url="https://chatgpt.com">
        <div class="tile-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2z"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
        </div>
        <span class="tile-title">ChatGPT</span>
      </div>

      <div class="speed-dial-tile" data-url="https://www.wikipedia.org">
        <div class="tile-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        </div>
        <span class="tile-title">Wikipedia</span>
      </div>
    </div>

    <!-- Floating Minimal Status & Action Dock -->
    <div class="status-dock">
      <span class="dock-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Shields Active
      </span>
      <button class="dock-btn" id="dockHistory">
        <span>History</span>
        <kbd>Ctrl+H</kbd>
      </button>
      <button class="dock-btn" id="dockDownloads">
        <span>Downloads</span>
        <kbd>Ctrl+J</kbd>
      </button>
      <button class="dock-btn" id="dockSettings">
        <span>Settings</span>
        <kbd>Ctrl+,</kbd>
      </button>
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');

    // Auto-focus input
    input.focus();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      if (window.electronAPI && window.electronAPI.performNavigation) {
        window.electronAPI.performNavigation(q);
      } else {
        if (/^https?:\/\//i.test(q) || /^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,5}/i.test(q)) {
          window.location.href = /^https?:\/\//i.test(q) ? q : 'https://' + q;
        } else {
          window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
        }
      }
    });

    // Speed Dial Click Handlers
    document.querySelectorAll('.speed-dial-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        const url = tile.getAttribute('data-url');
        if (url && window.electronAPI && window.electronAPI.performNavigation) {
          window.electronAPI.performNavigation(url);
        } else if (url) {
          window.location.href = url;
        }
      });
    });

    // Dock Action Buttons
    document.getElementById('dockHistory').addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.triggerAction) {
        window.electronAPI.triggerAction('search');
      }
    });

    document.getElementById('dockDownloads').addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.triggerAction) {
        window.electronAPI.triggerAction('downloads');
      }
    });

    document.getElementById('dockSettings').addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.triggerAction) {
        window.electronAPI.triggerAction('settings');
      }
    });

    // Sync theme setting
    if (window.electronAPI && window.electronAPI.getSettings) {
      window.electronAPI.getSettings().then(settings => {
        if (settings) {
          applyTheme(settings.themeMode || (settings.darkModeEnabled ? 'dark' : 'light'));
        }
      }).catch(() => {});

      if (window.electronAPI.onSettingsChanged) {
        window.electronAPI.onSettingsChanged(settings => {
          if (settings.themeMode) applyTheme(settings.themeMode);
        });
      }
    }

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme || 'dark');
    }
  </script>
</body>
</html>
