<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0c0c10;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: #121218;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --input-bg: #111116;
      --input-border: rgba(255, 255, 255, 0.14);
      --input-focus: #ffffff;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --card-bg: #f4f4f7;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: #ececee;
      --text-main: #09090b;
      --text-sub: #64748b;
      --input-bg: #f8fafc;
      --input-border: rgba(0, 0, 0, 0.15);
      --input-focus: #000000;
    }

    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --bg-color: #ffffff;
        --card-bg: #f4f4f7;
        --card-border: rgba(0, 0, 0, 0.08);
        --card-hover: #ececee;
        --text-main: #09090b;
        --text-sub: #64748b;
        --input-bg: #f8fafc;
        --input-border: rgba(0, 0, 0, 0.15);
        --input-focus: #000000;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 48px 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 740px;
      width: 100%;
    }

    /* Aura Brand Header with New Logo */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-frame {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 30px rgba(123, 44, 191, 0.45);
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .logo-frame:hover {
      transform: scale(1.06);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 245, 212, 0.5);
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
    }

    .brand-header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: var(--text-main);
    }

    /* Google Search Bar */
    .search-box-container {
      position: relative;
      width: 100%;
      margin-bottom: 30px;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 30px;
      padding: 6px 18px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .search-input-wrapper:hover,
    .search-input-wrapper:focus-within {
      border-color: var(--input-focus);
      box-shadow: 0 6px 32px rgba(0, 0, 0, 0.7);
    }

    .search-google-icon {
      margin-right: 12px;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      height: 46px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .search-input::placeholder {
      color: var(--text-sub);
    }

    .search-submit-btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .search-submit-btn:hover {
      transform: scale(1.08);
    }

    /* Status Badges */
    .status-badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
    }

    .status-badge.active {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.3);
      background: rgba(52, 211, 153, 0.08);
    }

    /* Grid Section for History & Downloads */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    @media (max-width: 650px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      min-height: 180px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-action {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .panel-action:hover {
      color: var(--text-main);
    }

    .panel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
      max-height: 160px;
    }

    .panel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 12px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .panel-item:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .panel-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .panel-item-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .empty-state {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin: auto 0;
      padding: 20px 0;
    }

    /* Shortcuts Card */
    .shortcuts-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: left;
    }

    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .shortcuts-grid {
        grid-template-columns: 1fr;
      }
    }

    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-sub);
      padding: 4px 0;
    }

    kbd {
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 2px 6px;
    }

    [data-theme="light"] kbd {
      background: rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body data-theme="dark">

  <div class="container">
    <!-- Brand Header with Custom Logo -->
    <div class="brand-header">
      <div class="logo-frame">
        <img src="assets/logo.jpg" alt="Aura Browser" />
      </div>
      <h1>Aura Browser</h1>
    </div>

    <!-- Centered Google Search Box -->
    <div class="search-box-container">
      <form id="googleSearchForm">
        <div class="search-input-wrapper">
          <div class="search-google-icon">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.29 21.43 7.37 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.29 2.57 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="googleSearchInput" 
            class="search-input" 
            placeholder="Search Google or enter a web URL..." 
            autocomplete="off" 
            autofocus 
          />
          <button type="submit" class="search-submit-btn" title="Search Google">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Status Badges -->
    <div class="status-badges">
      <span class="status-badge active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Ad Blocker Active
      </span>
      <span class="status-badge active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><rect width="8" height="6" x="12" y="9" rx="1"/></svg>
        Auto PiP Enabled
      </span>
      <span class="status-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/><polyline points="6 9 12 15 18 9"/></svg>
        Mouse Gestures Ready
      </span>
    </div>

    <!-- Dashboard: History & Downloads Section -->
    <div class="dashboard-grid">
      <!-- Recent History Card -->
      <div class="panel-card">
        <div class="panel-header">
          <span class="panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Recent History
          </span>
          <button class="panel-action" id="clearHistoryBtn">Clear</button>
        </div>
        <div class="panel-list" id="historyList">
          <div class="empty-state">No recent browsing history.</div>
        </div>
      </div>

      <!-- Recent Downloads Card -->
      <div class="panel-card">
        <div class="panel-header">
          <span class="panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Recent Downloads
          </span>
          <button class="panel-action" id="openDownloadsBtn">View All (Ctrl+J)</button>
        </div>
        <div class="panel-list" id="downloadsList">
          <div class="empty-state">No downloads yet.</div>
        </div>
      </div>
    </div>

    <!-- Essential Keyboard Shortcuts -->
    <div class="shortcuts-card">
      <div class="shortcuts-grid">
        <div class="shortcut-row">
          <span>Search / URL</span>
          <kbd>Ctrl + T</kbd>
        </div>
        <div class="shortcut-row">
          <span>Go Back</span>
          <kbd>Backspace</kbd>
        </div>
        <div class="shortcut-row">
          <span>Exit Prompt</span>
          <kbd>Esc</kbd>
        </div>
        <div class="shortcut-row">
          <span>Instant Exit</span>
          <kbd>Double Esc</kbd>
        </div>
        <div class="shortcut-row">
          <span>Minimize / Window</span>
          <kbd>Ctrl + Esc</kbd>
        </div>
        <div class="shortcut-row">
          <span>Settings</span>
          <kbd>Ctrl + ,</kbd>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('googleSearchForm');
    const input = document.getElementById('googleSearchInput');
    const historyList = document.getElementById('historyList');
    const downloadsList = document.getElementById('downloadsList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const openDownloadsBtn = document.getElementById('openDownloadsBtn');

    // Auto-focus search input
    input.focus();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      if (window.electronAPI && window.electronAPI.performNavigation) {
        window.electronAPI.performNavigation(q);
      } else {
        if (/^https?:\/\//i.test(q) || /^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,5}/i.test(q)) {
          window.location.href = /^https?:\/\//i.test(q) ? q : 'https://' + q;
        } else {
          window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
        }
      }
    });

    // Load History
    async function loadHistory() {
      if (!window.electronAPI || !window.electronAPI.getHistory) return;
      try {
        const history = await window.electronAPI.getHistory();
        if (history && history.length > 0) {
          historyList.innerHTML = '';
          history.slice(0, 5).forEach(item => {
            const el = document.createElement('div');
            el.className = 'panel-item';
            el.innerHTML = `
              <div class="panel-item-left">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span class="panel-item-title">${escapeHtml(item.title || item.url)}</span>
              </div>
            `;
            el.addEventListener('click', () => {
              window.electronAPI.performNavigation(item.url);
            });
            historyList.appendChild(el);
          });
        }
      } catch (err) {}
    }

    clearHistoryBtn.addEventListener('click', async () => {
      if (window.electronAPI && window.electronAPI.clearHistory) {
        await window.electronAPI.clearHistory();
        historyList.innerHTML = '<div class="empty-state">No recent browsing history.</div>';
      }
    });

    // Load Downloads
    async function loadDownloads() {
      if (!window.electronAPI || !window.electronAPI.getDownloads) return;
      try {
        const downloads = await window.electronAPI.getDownloads();
        if (downloads && downloads.length > 0) {
          downloadsList.innerHTML = '';
          downloads.slice(0, 5).forEach(item => {
            const el = document.createElement('div');
            el.className = 'panel-item';
            el.innerHTML = `
              <div class="panel-item-left">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="panel-item-title">${escapeHtml(item.filename || 'File')}</span>
              </div>
              <span style="font-size:10px; color:#34d399;">${item.state === 'completed' ? 'Done' : item.state}</span>
            `;
            el.addEventListener('click', () => {
              window.electronAPI.openDownload(item.id);
            });
            downloadsList.appendChild(el);
          });
        }
      } catch (err) {}
    }

    openDownloadsBtn.addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.triggerAction) {
        window.electronAPI.triggerAction('downloads');
      }
    });

    // Sync theme setting
    if (window.electronAPI && window.electronAPI.getSettings) {
      window.electronAPI.getSettings().then(settings => {
        if (settings) {
          applyTheme(settings.themeMode || (settings.darkModeEnabled ? 'dark' : 'light'));
        }
      }).catch(() => {});

      if (window.electronAPI.onSettingsChanged) {
        window.electronAPI.onSettingsChanged(settings => {
          if (settings.themeMode) applyTheme(settings.themeMode);
        });
      }
    }

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme || 'dark');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadHistory();
    loadDownloads();
  </script>
</body>
</html>
